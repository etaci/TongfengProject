server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/tongfeng?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:tongfeng}
spring.datasource.password=${DB_PASSWORD:tongfeng}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:16}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:4}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=${REDIS_ENABLED:false}
management.health.mail.enabled=${AUTH_EMAIL_ENABLED:false}

app.ai-base-url=${AI_BASE_URL:http://backend-ai:8001}
app.storage-root=${APP_STORAGE_ROOT:/app/storage}
