spring.application.name=backend-java
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/tongfeng;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.repositories.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
app.ai-base-url=http://localhost:8001
app.storage-root=./storage
app.auth-token-days=30
app.redis-enabled=${REDIS_ENABLED:false}
app.session-cache-prefix=tongfeng:session:
app.scheduler-enabled=${SCHEDULER_ENABLED:true}
app.reminder-refresh-cron=${REMINDER_REFRESH_CRON:0 0/30 * * * *}
app.summary-refresh-cron=${SUMMARY_REFRESH_CRON:0 5 0 * * * *}
app.auth-verification-code-minutes=${AUTH_VERIFICATION_CODE_MINUTES:15}
app.auth-expose-verification-code=${AUTH_EXPOSE_VERIFICATION_CODE:true}
app.auth-verification-resend-cooldown-seconds=${AUTH_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
app.auth-verification-rate-limit-window-minutes=${AUTH_VERIFICATION_RATE_LIMIT_WINDOW_MINUTES:30}
app.auth-verification-max-requests-per-window=${AUTH_VERIFICATION_MAX_REQUESTS_PER_WINDOW:5}
app.auth-verification-max-attempts-per-code=${AUTH_VERIFICATION_MAX_ATTEMPTS_PER_CODE:5}
app.auth-known-device-days=${AUTH_KNOWN_DEVICE_DAYS:90}
app.auth-login-failure-threshold=${AUTH_LOGIN_FAILURE_THRESHOLD:5}
app.auth-login-failure-lock-minutes=${AUTH_LOGIN_FAILURE_LOCK_MINUTES:15}
app.auth-email-enabled=${AUTH_EMAIL_ENABLED:false}
app.auth-email-from=${AUTH_EMAIL_FROM:no-reply@tongfeng.local}
app.auth-email-subject-prefix=${AUTH_EMAIL_SUBJECT_PREFIX:[痛风主动管理]}
app.auth-email-smtp-host=${AUTH_EMAIL_SMTP_HOST:}
app.auth-email-smtp-port=${AUTH_EMAIL_SMTP_PORT:587}
app.auth-email-smtp-username=${AUTH_EMAIL_SMTP_USERNAME:}
app.auth-email-smtp-password=${AUTH_EMAIL_SMTP_PASSWORD:}
app.auth-email-starttls-enabled=${AUTH_EMAIL_STARTTLS_ENABLED:true}
app.auth-sms-enabled=${AUTH_SMS_ENABLED:false}
app.auth-sms-webhook-url=${AUTH_SMS_WEBHOOK_URL:}
app.auth-sms-bearer-token=${AUTH_SMS_BEARER_TOKEN:}
app.weather-live-enabled=${WEATHER_LIVE_ENABLED:true}
app.weather-geocoding-base-url=${WEATHER_GEOCODING_BASE_URL:https://geocoding-api.open-meteo.com}
app.weather-forecast-base-url=${WEATHER_FORECAST_BASE_URL:https://api.open-meteo.com}
app.family-enabled=${FEATURE_FAMILY_ENABLED:true}
